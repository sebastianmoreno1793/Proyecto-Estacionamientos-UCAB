# Mueve la tarjeta "HU X.Y" del tablero de Trello según lo que pasa en GitHub.
#   Issue asignado              -> En proceso
#   PR abierto con "Closes #N"  -> En revisión
#   Issue cerrado               -> Hecho
#   Issue reabierto             -> Por hacer (Sprint 1)
# Secretos necesarios: TRELLO_KEY y TRELLO_TOKEN (Settings > Secrets and variables > Actions).
name: Sincronizar con Trello

on:
  issues:
    types: [assigned, closed, reopened]
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  issues: read
  pull-requests: read

jobs:
  mover-tarjeta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          TRELLO_BOARD: WQSBIFTj
        with:
          script: |
            const { TRELLO_KEY, TRELLO_TOKEN, TRELLO_BOARD } = process.env;
            if (!TRELLO_KEY || !TRELLO_TOKEN) { core.warning('Faltan los secretos TRELLO_KEY / TRELLO_TOKEN.'); return; }
            const auth = `key=${TRELLO_KEY}&token=${TRELLO_TOKEN}`;
            const trello = async (path, method = 'GET') => {
              const sep = path.includes('?') ? '&' : '?';
              const r = await fetch(`https://api.trello.com/1${path}${sep}${auth}`, { method });
              if (!r.ok) throw new Error(`Trello ${method} ${path.split('?')[0]}: ${r.status}`);
              return r.json();
            };

            // 1) ¿Qué issues y a qué lista?
            const ev = context.eventName, act = context.payload.action;
            let destino, issues = [];
            if (ev === 'issues') {
              destino = { assigned: 'En proceso', closed: 'Hecho', reopened: 'Por hacer (Sprint 1)' }[act];
              issues = [context.payload.issue];
            } else {
              destino = 'En revisión';
              const body = context.payload.pull_request.body || '';
              const nums = [...body.matchAll(/(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi)].map(m => +m[1]);
              for (const n of nums) issues.push((await github.rest.issues.get({ ...context.repo, issue_number: n })).data);
              if (!issues.length) { core.info('El PR no dice "Closes #N": no se mueve ninguna tarjeta.'); return; }
            }

            // 2) Buscar listas y tarjetas del tablero
            const lists = await trello(`/boards/${TRELLO_BOARD}/lists?fields=name`);
            const lista = lists.find(l => l.name === destino);
            if (!lista) { core.setFailed(`No existe la lista "${destino}" en Trello.`); return; }
            const cards = await trello(`/boards/${TRELLO_BOARD}/cards?fields=name,idList`);

            // 3) Mover cada tarjeta "HU X.Y"
            for (const issue of issues) {
              const m = issue.title.match(/HU\s*(\d+\.\d+)/i);
              if (!m) { core.info(`#${issue.number} no tiene código HU.`); continue; }
              const re = new RegExp(`^HU\\s*${m[1].replace('.', '\\.')}(?!\\d)`, 'i');
              const card = cards.find(c => re.test(c.name));
              if (!card) { core.warning(`No hay tarjeta "HU ${m[1]}" en Trello.`); continue; }
              if (card.idList === lista.id) { core.info(`HU ${m[1]} ya está en "${destino}".`); continue; }
              await trello(`/cards/${card.id}?idList=${lista.id}&pos=top`, 'PUT');
              core.info(`HU ${m[1]} → "${destino}"`);
            }
