<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Diagrama de actividades HU 9.1</title>
<style>
body{margin:0;background:#fff}
svg{display:block;font-family:Arial,Helvetica,sans-serif}
.titulo{font-size:24px;font-weight:700;fill:#000}
.carril{fill:#fff;stroke:#000;stroke-width:2}
.cabecera{fill:#dae8fc;stroke:#000;stroke-width:2}
.divisor{stroke:#000;stroke-width:2}
.carril-t{font-size:21px;font-weight:700;fill:#000;text-anchor:middle}
.accion{fill:#fff;stroke:#000;stroke-width:2}
.objeto{fill:#fff;stroke:#000;stroke-width:1.5}
.rombo{fill:#fff;stroke:#000;stroke-width:2}
.barra{fill:#000}
.conector{fill:#fff;stroke:#000;stroke-width:2}
.num{font-size:18px;font-weight:700;text-anchor:middle}
.t{font-size:19px;fill:#000;text-anchor:middle}
.t2{font-size:17px;fill:#000;text-anchor:middle}
.tn{font-size:16px;fill:#000;text-anchor:middle}
.guarda{font-size:18px;fill:#000}
.flecha{fill:none;stroke:#000;stroke-width:2}
.punteada-f{stroke-dasharray:7 5}
.punteada{stroke:#000;stroke-width:1.5;stroke-dasharray:4 4}
.nota{fill:#fff2cc;stroke:#d6b656;stroke-width:1.5}
.inicio{fill:#000}
.fin-borde{fill:#fff;stroke:#000;stroke-width:3}
@page{size:1520px 1830px;margin:0}</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1830" viewBox="0 0 1520 1830">
<defs><marker id="punta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs>
<text x="20" y="44" class="titulo">HU 9.1 · Crear una incidencia — Diagrama de Actividades — Autor: Moreno, Sebastian</text>
<rect x="20" y="70" width="1480" height="1730" class="carril"/>
<rect x="20" y="70" width="1480" height="54" class="cabecera"/>
<line x1="700" y1="70" x2="700" y2="1800" class="divisor"/>
<text x="360" y="105" class="carril-t">Conductor (estudiante o profesor)</text>
<text x="1100" y="105" class="carril-t">Sistema</text>
<circle cx="400" cy="165" r="20" class="inicio"/>
<line x1="420" y1="165" x2="445" y2="165" class="punteada"/>
<path d="M 445,140 L 581,140 L 595,154 L 595,190 L 445,190 Z" class="nota"/>
<text x="520.0" y="161.0" class="tn">Se inicia el</text>
<text x="520.0" y="181.0" class="tn">Caso de Uso</text>
<path d="M 400,185 L 400,220" class="flecha" marker-end="url(#punta)"/>
<rect x="250.0" y="220" width="300" height="70" rx="16" class="accion"/>
<text x="400" y="261.0" class="t">1) Abre la opción «Reportar»</text>
<path d="M 550,255 L 1030,255" class="flecha" marker-end="url(#punta)"/>
<rect x="1030.0" y="220" width="300" height="70" rx="16" class="accion"/>
<text x="1180" y="249.0" class="t">2) Verifica la sesión</text>
<text x="1180" y="273.0" class="t">del usuario</text>
<path d="M 1180,290 L 1180,330" class="flecha" marker-end="url(#punta)"/>
<polygon points="1180,330 1220,370 1180,410 1140,370" class="rombo"/>
<path d="M 1140,370 L 980,370" class="flecha" marker-end="url(#punta)"/>
<text x="1085" y="360" class="guarda" text-anchor="middle">[Sin sesión]</text>
<rect x="740.0" y="335" width="240" height="70" rx="16" class="accion"/>
<text x="860" y="364.0" class="t">2.1) Muestra interfaz</text>
<text x="860" y="388.0" class="t">«Entrar»</text>
<path d="M 860,405 L 860,440 L 400,440 L 400,470" class="flecha" marker-end="url(#punta)"/>
<rect x="250.0" y="470" width="300" height="70" rx="16" class="accion"/>
<text x="400" y="499.0" class="t">2.2) Inicia sesión con su</text>
<text x="400" y="523.0" class="t">correo institucional</text>
<path d="M 400,540 L 400,572" class="flecha" marker-end="url(#punta)"/>
<circle cx="400" cy="590" r="18" class="conector"/>
<text x="400" y="596" class="num">1</text>
<path d="M 1180,410 L 1180,640" class="flecha" marker-end="url(#punta)"/>
<text x="1192" y="470" class="guarda" text-anchor="start">[Con sesión]</text>
<circle cx="1100" cy="590" r="18" class="conector"/>
<text x="1100" y="596" class="num">1</text>
<path d="M 1100,608 L 1100,640" class="flecha" marker-end="url(#punta)"/>
<rect x="1060" y="640" width="240" height="10" class="barra"/>
<path d="M 1180,650 L 1180,690" class="flecha" marker-end="url(#punta)"/>
<rect x="1020.0" y="690" width="320" height="80" rx="16" class="accion"/>
<text x="1180" y="712.0" class="t">3) Muestra el formulario con los</text>
<text x="1180" y="736.0" class="t">estacionamientos abiertos y los</text>
<text x="1180" y="760.0" class="t">tres tipos de problema</text>
<path d="M 1340,730 L 1365,730" class="flecha punteada-f" marker-end="url(#punta)"/>
<rect x="1365" y="700" width="125" height="60" class="objeto"/>
<text x="1427.5" y="725.0" class="t2">«Formulario</text>
<text x="1427.5" y="747.0" class="t2">de incidencia»</text>
<path d="M 1180,770 L 1180,810 L 420,810 L 420,850" class="flecha" marker-end="url(#punta)"/>
<circle cx="300" cy="800" r="18" class="conector"/>
<text x="300" y="806" class="num">2</text>
<path d="M 300,818 L 300,850" class="flecha" marker-end="url(#punta)"/>
<rect x="260" y="850" width="280" height="10" class="barra"/>
<path d="M 400,860 L 400,900" class="flecha" marker-end="url(#punta)"/>
<rect x="250.0" y="900" width="300" height="70" rx="16" class="accion"/>
<text x="400" y="941.0" class="t">4) Elige el estacionamiento</text>
<path d="M 400,970 L 400,1010" class="flecha" marker-end="url(#punta)"/>
<rect x="250.0" y="1010" width="300" height="70" rx="16" class="accion"/>
<text x="400" y="1051.0" class="t">5) Elige el tipo de problema</text>
<path d="M 400,1080 L 400,1110" class="flecha" marker-end="url(#punta)"/>
<polygon points="400,1110 440,1150 400,1190 360,1150" class="rombo"/>
<path d="M 360,1150 L 255,1150" class="flecha" marker-end="url(#punta)"/>
<text x="308" y="1140" class="guarda" text-anchor="middle">[Cancelar]</text>
<rect x="35.0" y="1115" width="220" height="70" rx="16" class="accion"/>
<text x="145" y="1144.0" class="t">6.1) Cierra el</text>
<text x="145" y="1168.0" class="t">formulario sin reportar</text>
<path d="M 145,1185 L 145,1240" class="flecha" marker-end="url(#punta)"/>
<circle cx="145" cy="1260" r="20" class="fin-borde"/><circle cx="145" cy="1260" r="13" class="inicio"/>
<line x1="145" y1="1280" x2="145" y2="1305" class="punteada"/>
<path d="M 65,1305 L 211,1305 L 225,1319 L 225,1351 L 65,1351 Z" class="nota"/>
<text x="145.0" y="1324.0" class="tn">Finaliza el</text>
<text x="145.0" y="1344.0" class="tn">Caso de Uso</text>
<path d="M 400,1190 L 400,1240" class="flecha" marker-end="url(#punta)"/>
<text x="412" y="1222" class="guarda" text-anchor="start">[Enviar]</text>
<rect x="250.0" y="1240" width="300" height="70" rx="16" class="accion"/>
<text x="400" y="1281.0" class="t">6) Pulsa «Enviar reporte»</text>
<path d="M 550,1275 L 1030,1275" class="flecha" marker-end="url(#punta)"/>
<rect x="1030.0" y="1240" width="300" height="70" rx="16" class="accion"/>
<text x="1180" y="1269.0" class="t">7) Valida el estacionamiento</text>
<text x="1180" y="1293.0" class="t">y el tipo de problema</text>
<path d="M 1180,1310 L 1180,1340" class="flecha" marker-end="url(#punta)"/>
<polygon points="1180,1340 1220,1380 1180,1420 1140,1380" class="rombo"/>
<path d="M 1140,1380 L 980,1380" class="flecha" marker-end="url(#punta)"/>
<text x="1080" y="1370" class="guarda" text-anchor="middle">[Falta un dato]</text>
<rect x="740.0" y="1345" width="240" height="70" rx="16" class="accion"/>
<text x="860" y="1374.0" class="t">7.1) Indica qué falta</text>
<text x="860" y="1398.0" class="t">elegir</text>
<path d="M 860,1415 L 860,1452" class="flecha" marker-end="url(#punta)"/>
<circle cx="860" cy="1470" r="18" class="conector"/>
<text x="860" y="1476" class="num">2</text>
<path d="M 1180,1420 L 1180,1480" class="flecha" marker-end="url(#punta)"/>
<text x="1192" y="1456" class="guarda" text-anchor="start">[Datos completos]</text>
<rect x="1020.0" y="1480" width="320" height="80" rx="16" class="accion"/>
<text x="1180" y="1502.0" class="t">8) Registra la incidencia con</text>
<text x="1180" y="1526.0" class="t">la fecha, la hora y el estado</text>
<text x="1180" y="1550.0" class="t">«pendiente»</text>
<path d="M 1340,1520 L 1365,1520" class="flecha punteada-f" marker-end="url(#punta)"/>
<rect x="1365" y="1490" width="125" height="60" class="objeto"/>
<text x="1427.5" y="1526.0" class="t2">Incidencia</text>
<path d="M 1180,1560 L 1180,1600" class="flecha" marker-end="url(#punta)"/>
<rect x="1020.0" y="1600" width="320" height="80" rx="16" class="accion"/>
<text x="1180" y="1622.0" class="t">9) Muestra la confirmación con</text>
<text x="1180" y="1646.0" class="t">el estacionamiento, el tipo,</text>
<text x="1180" y="1670.0" class="t">la hora y el estado</text>
<path d="M 1020,1640 L 550,1640" class="flecha" marker-end="url(#punta)"/>
<rect x="250.0" y="1605" width="300" height="70" rx="16" class="accion"/>
<text x="400" y="1646.0" class="t">10) Lee la confirmación</text>
<path d="M 400,1675 L 400,1720" class="flecha" marker-end="url(#punta)"/>
<circle cx="400" cy="1740" r="20" class="fin-borde"/><circle cx="400" cy="1740" r="13" class="inicio"/>
<line x1="420" y1="1740" x2="445" y2="1740" class="punteada"/>
<path d="M 445,1717 L 581,1717 L 595,1731 L 595,1763 L 445,1763 Z" class="nota"/>
<text x="520.0" y="1736.0" class="tn">Finaliza el</text>
<text x="520.0" y="1756.0" class="tn">Caso de Uso</text>
</svg></body></html>
